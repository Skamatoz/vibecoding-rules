# pnpm не запускает install-скрипты зависимостей без разрешения. Nuxt они нужны для сборки.
# Ключ allowBuilds — из pnpm 11 (Dockerfile ставит pnpm 11.6.0). В pnpm 10 он назывался onlyBuiltDependencies.
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  vue-demi: false

# Версии пакетов моложе суток не ставим: заражённые выпуски обычно ловят и снимают
# в первые часы. Значение — в минутах. Не убирать.
minimumReleaseAge: 1440
