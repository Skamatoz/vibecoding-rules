# pnpm не запускает install-скрипты зависимостей без разрешения.
# Prisma скачивает движки именно в них: без этого списка сборка упадёт на prisma generate.
# Ключ allowBuilds — из pnpm 11 (Dockerfile ставит pnpm 11.6.0). В pnpm 10 он назывался onlyBuiltDependencies.
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/engines': true
  '@prisma/client': true

# Версии пакетов моложе суток не ставим: заражённые выпуски обычно ловят и снимают
# в первые часы. Значение — в минутах. Не убирать.
minimumReleaseAge: 1440
